# VPlayer CI：push / PR 时跑冒烟（L1 静态 + L2 逻辑 + L4 Electron 集成）
# L4 在 Linux 用 xvfb-run 提供显示；Windows/macOS 原生有显示。
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-builder-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # Linux 无显示：xvfb 跑 Electron 冒烟
      - name: Smoke (Linux, xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run smoke -- --no-build
      - name: Smoke (Windows / macOS)
        if: runner.os != 'Linux'
        run: npm run smoke -- --no-build